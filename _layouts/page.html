<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <link href="{{ '/assets/css/styles.css' | relative_url }}" rel="stylesheet"/>
  </head>
  <body>
    {% include navbar.html %}
 
    <img alt="page banner picture" src="{{ page.banner }}" class="banner-img"/>

    <main>
      <div class="content-grid-container">
        
        <div class="grid-item-toc">
          {% include toc.html html=content class="toc" %}
        </div>

        <div class="grid-item-page-heading page-heading">
          <h1>{{ page.title }}</h1>
          <span>{{ page.subtitle }}</span>
        </div>
        
        <div class="grid-item-page-text">
          {{ content }}
        </div>
        
      </div>
    </main>
    {% include basement.html %}
  </body>
</html>
